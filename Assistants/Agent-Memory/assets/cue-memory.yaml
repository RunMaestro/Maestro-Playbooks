# Maestro Cue subscriptions for the Agent Memory playbook.
#
# This is a SHAPE, not a drop-in file. Document 2 fills every <PLACEHOLDER> from MEMORY_PLAN.md and document 4
# appends the result to the subscription list in <agent cwd>/.maestro/cue.yaml. It never overwrites that file.
#
# Placeholders:
#   <SLUG>            agent slug from the plan (prefixes every name, so two agents never collide)
#   <AGENT_ID>        this agent's Maestro id
#   <ENV>             the environment prefix, one line:
#                       AGENT_VAULT=<VAULT> AGENT_DIR=<AGENT_DIR> AGENT_TZ=<TZ> AGENT_MEMORY_STATE=<STATE>
#                       MAESTRO_AGENT_ID=<AGENT_ID> MAESTRO_CLI=<maestro-cli path> PATH=<node dir>:/usr/bin:/bin
#   <PY>              absolute python3 path
#   <VAULT>           absolute vault path; <AGENT_DIR> the agent folder, relative to it
#   <INSTRUCTIONS_FILE_NAME>   CLAUDE.md or AGENTS.md, relative to <VAULT>
#   <TOOLS>           absolute Tools folder
#   <MEMDIR>          absolute Memory folder
#   <STORE>           absolute store folder (MEMDIR/<store_dir>; default MEMDIR/Store)
#   <DREAM_DIR>       absolute L5 store (MEMORY_DIR)
#   <SESSIONS>        absolute L5 session folder (MEMORY_SESSIONS)
#   <PROJECTS>        Claude Code transcripts: <CLAUDE_CONFIG_DIR>/projects/<cwd-slug>
#   <DREAM_HH:MM>     NIGHTLY_TIME; <PROMOTE_HH:MM> +30 min; <CHECK_HH:MM> +60 min
#   <WEEKDAY> <WEEKLY_HH:MM>   from WEEKLY_SLOT
#
# Every job runs through run_guarded.py: if a job changes CLAUDE.md, AGENTS.md or a rules file, the change is
# reverted and kept as <name>.rejected. Every path is absolute because Cue runs commands with a minimal PATH.
# Drop the subscriptions of layers the plan turned OFF. For an SSH-remote agent, convert each one to
# `action: prompt` (see 2_PLAN Task 9).

# L4: re-index search every 2 hours.
- name: <SLUG>-memory-search-index
  event: time.heartbeat
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Memory search re-index (qmd)
  interval_minutes: 120
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> <PY> <TOOLS>/run_guarded.py -- /bin/bash <TOOLS>/qmd-update.sh

# L5: nightly dream over yesterday's sessions (Claude Code transcripts).
- name: <SLUG>-memory-dream
  event: time.scheduled
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Nightly memory dream (L5)
  schedule_times:
    - '<DREAM_HH:MM>'
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> MEMORY_DIR=<DREAM_DIR> MEMORY_SESSIONS=<SESSIONS> <PY> <TOOLS>/run_guarded.py -- /bin/sh -c
      '<PY> <TOOLS>/cc_sessions.py --projects <PROJECTS> --out <SESSIONS> --days 2 && <PY> <TOOLS>/memory.py dream'

# L3 -> L2: nightly promotion (dry-run until the review gate opens), then the lint (no model).
- name: <SLUG>-memory-promote-lint
  event: time.scheduled
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Nightly memory promotion + lint
  schedule_times:
    - '<PROMOTE_HH:MM>'
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> <PY> <TOOLS>/run_guarded.py -- /bin/sh -c
      '<PY> <TOOLS>/memory_promote.py; <PY> <TOOLS>/memory_lint.py'

# L1 + L2: daily index check (budget, dead pointers, unindexed memories).
- name: <SLUG>-memory-index-check
  event: time.scheduled
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Memory index check
  schedule_times:
    - '<CHECK_HH:MM>'
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> <PY> <TOOLS>/run_guarded.py -- <PY> <TOOLS>/memory_index_check.py <STORE>

# L2: weekly smoke test. Answers what memory knows, refuses what it does not.
- name: <SLUG>-memory-smoke
  event: time.scheduled
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Memory smoke test (weekly)
  schedule_times:
    - '<WEEKLY_HH:MM>'
  schedule_days:
    - <WEEKDAY>
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> <PY> <TOOLS>/run_guarded.py -- <PY> <TOOLS>/memory_smoke.py

# L0: weekly instructions audit (size budget, dead references). Reads only.
- name: <SLUG>-memory-instructions-audit
  event: time.scheduled
  agent_id: <AGENT_ID>
  pipeline_name: Memory
  label: Instructions audit (weekly)
  schedule_times:
    - '<WEEKLY_HH:MM>'
  schedule_days:
    - <WEEKDAY>
  action: command
  command:
    mode: shell
    shell: >-
      <ENV> <PY> <TOOLS>/run_guarded.py -- <PY> <TOOLS>/claude_md_audit.py --root <VAULT>
      --claude-md <INSTRUCTIONS_FILE_NAME> --rules <AGENT_DIR>/Rules
